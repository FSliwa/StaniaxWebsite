          if (initialized) return;
          initialized = true;

          var script = document.createElement('script');
          script.async = true;

          document.head.appendChild(script);

          gtag('js', new Date());
          gtag('config', 'G-K4E0LDH848', {
            send_page_view: false,
            anonymize_ip: true
          });

          if (!window.__lastTrackedStaniaxPath) {
            window.__lastTrackedStaniaxPath = window.location.pathname;
            gtag('event', 'page_view', {
              page_title: document.title,
              page_path: window.location.pathname,
              page_location: window.location.href,
              language: document.documentElement.lang || 'pl'
            });
          }
        }

        window.updateStaniaxConsent = function(granted) {
          initGtag();
          gtag('consent', 'update', {
            ad_storage: 'denied',
            ad_user_data: 'denied',
            ad_personalization: 'denied',
            analytics_storage: granted ? 'granted' : 'denied'
          });
        };

        window.trackEvent = function(eventName, params) {
          initGtag();
          if (typeof window.gtag === 'function') {
            window.gtag('event', eventName, Object.assign({ transport_type: 'beacon' }, params || {}));
          }
        };

        var interactionEvents = ['mouseover', 'keydown', 'touchstart', 'scroll', 'click'];
        function triggerGtag() {
          initGtag();

            window.removeEventListener(event, triggerGtag, { passive: true });
          });
        }

        interactionEvents.forEach(function(event) {
          window.addEventListener(event, triggerGtag, { passive: true });
        });

        if (typeof window.requestIdleCallback === 'function') {
          window.requestIdleCallback(initGtag, { timeout: 1200 });
        } else {
          window.addEventListener('load', function() {
            setTimeout(initGtag, 900);
          });
        }

        document.addEventListener('click', function(e) {
          var target = e.target && e.target.closest ? e.target.closest('a') : null;
          if (!target) return;
          var href = target.getAttribute('href') || '';
          if (href.indexOf('tel:') === 0) {
            window.trackEvent('click_phone', {
              phone_number: href.replace('tel:', ''),
              page_path: window.location.pathname,
              transport_type: 'beacon'

            window.trackEvent('click_email', {
              email_address: href.replace('mailto:', ''),
              page_path: window.location.pathname,
              transport_type: 'beacon'
            });

              destination: href,
              page_path: window.location.pathname,
              transport_type: 'beacon'
            });

        }, { passive: true });
