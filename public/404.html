<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Nie znaleziono strony (404) | STANIAX</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #f8fafc;
        padding: 2rem;
      }
      main { max-width: 34rem; text-align: center; }
      p.code { font-size: .75rem; letter-spacing: .4em; text-transform: uppercase; color: #60a5fa; margin: 0 0 1rem; }
      h1 { font-size: clamp(1.75rem, 5vw, 2.75rem); line-height: 1.15; margin: 0 0 1rem; }
      p.lead { color: #94a3b8; line-height: 1.6; margin: 0 0 2rem; }
      .links { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
      a {
        display: inline-block;
        padding: .75rem 1.5rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        border: 1px solid rgba(255,255,255,.25);
        color: #f8fafc;
      }
      a.primary { background: #2563eb; border-color: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Błąd 404</p>
      <h1>Ta strona nie istnieje</h1>
      <p class="lead">
        Adres, który otworzyłeś, jest nieaktualny lub zawiera literówkę.
        Przejdź na stronę główną albo zajrzyj do galerii realizacji.
      </p>
      <div class="links">
        <a class="primary" href="/">Strona główna</a>
        <a href="/gallery">Galeria realizacji</a>
        <a href="/news">Baza wiedzy</a>
      </div>
    </main>
  </body>
</html>
